<script>
// o tamanho do MaiSim (+ e − no trilho, localStorage "maisim-escala"), antes de pintar; embutido no simu (iframe), não: o simu já escala
try { const z = parseFloat(localStorage.getItem("maisim-escala")); if (window.top === window.self && [0.8, 0.9, 1.1, 1.25, 1.4].includes(z)) document.documentElement.style.zoom = z; } catch (e) { /* 100 % */ }
// o tema do MaiSim (o trilho escolhe e guarda em localStorage "maisim-tema": sistema, claro ou escuro), antes de pintar; também
// embutido no simu (Marcelo, 20/10: "a aba scope não está respeitando os temas"); o scope.js acompanha as trocas
try { const t = localStorage.getItem("maisim-tema") || "sistema";
  document.documentElement.dataset.tema = t === "escuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro"; }
catch (e) { document.documentElement.dataset.tema = "claro"; }
</script>

    <div class="grupo"><button id="bt-vivo" class="ativo">Ao vivo</button><button id="bt-comparar">Comparar</button></div>
    <div class="grupo"><label>A <select id="sel-a" class="sel-rodada"></select></label>
      <label>B <select id="sel-b" class="sel-rodada"></select></label><button id="bt-carregar">Carregar</button></div>
    <span id="status">aguardando…</span>
  </div>
  <div class="linha">
    <button id="bt-indice" title="índice das seções e painéis, ao lado (clique para ir direto a um gráfico)">☰ Índice</button>
    <label title="durante a rodada ao vivo, não reajusta as escalas"><input type="checkbox" id="ck-fixar"> Fixar eixos</label>
    <label title="para de redesenhar (os dados continuam chegando)"><input type="checkbox" id="ck-pausar"> Pausar</label>
    <div class="grupo">
      <button id="bt-painel">+ Painel</button>
      <button id="bt-secao" title="novo título de seção no fim">+ Seção</button>
      <button id="bt-porlinha" title="quantos painéis por linha, para todos (cada painel muda o seu no menu ⋯)">Por linha: 2</button>
      <span class="menu-layout"><button id="bt-layout" title="o layout deste circuito: guardar como padrão, voltar ao padrão, ou o automático">Layout ▾</button>
        <span id="menu-layout" hidden><button id="ml-guardar" title="guarda o layout de agora como o padrão do circuito, ao lado dele (vai junto com o circuito)">Guardar como padrão deste circuito</button>
        <button id="ml-padrao" title="volta ao padrão guardado do circuito (o que você mexeu depois sai)">Voltar ao padrão</button>
        <button id="bt-padrao" title="o layout automático: um painel com os sinais da rodada (o dos outros circuitos fica)">Automático (os sinais da rodada)</button></span></span>
      <button id="bt-exportar" title="baixa um arquivo com os painéis, as seções e as cores dos sinais (para outro MaiSim ou um colega)">Exportar visões</button>
      <button id="bt-importar" title="troca os painéis, as seções e as cores pelos de um arquivo exportado (do MaiSim ou do PEW)">Importar visões…</button>
      <input type="file" id="arq-visoes" accept=".json,application/json" hidden>
      <button id="bt-salvar" title="salva todos os painéis numa imagem PNG">Salvar figura</button>
      <button id="bt-apagar" title="escolher gravações (scope_*.npz) para apagar do disco">Apagar gravações…</button>
    </div>
    <button id="bt-ajuda" title="Zoom em cada painel: escolha X (tempo), Y (vertical) ou área e arraste no gráfico; ⟲ ou duplo clique volta a ver tudo naquele painel.
Ctrl + roda: zoom no tempo. Ctrl + Shift + roda: vertical.
O tempo é comum aos painéis ligados (corrente); clique na corrente para dar a um painel o seu próprio tempo (corrente partida, laranja).
Medir: média, série de Fourier, THD e espectro num intervalo; Shift + arrastar no gráfico escolhe o intervalo.
Sinais ▾ troca as variáveis; Y fixo guarda uma escala vertical; ⋯ tem largura, altura e PNG do painel.
A alça ⠿ arrasta o painel para outro lugar, outra seção ou para uma seção no índice; a ⠿ da seção a leva inteira, com os painéis (no índice, arraste o nome da seção).
A seta ▾ recolhe a seção (os painéis somem até abrir de novo) ou o painel (fica só o título); fica guardado no layout.
⤢ expande o painel para a janela inteira; Esc, ⤡ ou um clique fora volta.
Sinais de passo fino (pulsos, tensões PWM, medidas do Gecko) aparecem a cada 1 µs com zoom abaixo de 40 ms; com zoom maior, como média em cada janela de 20 µs.
A em cores; B em preto tracejado.">?</button>
  </div>
</header>
<div id="corpo">
<nav id="indice"><label class="unica" title="mostra só a seção escolhida no índice, como abas"><input type="checkbox" id="ck-unica"> uma seção por vez</label>
  <div class="lista"></div></nav>
<main>
  <div id="paineis"></div>
  <div id="so-vazio" class="vazio" hidden>Aguardando os sinais da rodada… inicie a simulação no simu (Simulação ▸ Iniciar, ou Ctrl+Enter).</div>
</main>
</div>
<div id="fundo-exp" hidden></div>
<div id="janela-apagar"><div class="caixa">
  <div class="topo">Apagar gravações do maisim-scope <span id="ap-total" style="font-weight:400;color:var(--sutil)"></span></div>
  <div class="filtros"><input id="ap-filtro" type="search" placeholder="filtrar: circuito, nome da rodada, data (ex.: 22/10)…" aria-label="filtrar as gravações">
    <label class="todas"><input type="checkbox" id="ap-todas"> marcar todas <span id="ap-vis"></span></label></div>
  <div class="lista" id="ap-lista"></div>
  <label class="orfas" id="ap-orfas-l" hidden><input type="checkbox" id="ap-orfas"> <span id="ap-orfas-t"></span></label>
  <div class="rodape"><span id="ap-marcadas" style="margin-right:auto;color:var(--sutil)"></span>
    <button id="ap-fechar">Cancelar</button><button id="ap-ok" class="perigo">Apagar marcadas</button></div>
</div></div>
