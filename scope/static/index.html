<script>

try { const z = parseFloat(localStorage.getItem("maisim-escala")); if (window.top === window.self && [0.8, 0.9, 1.1, 1.25, 1.4].includes(z)) document.documentElement.style.zoom = z; } catch (e) { /* 100 % */ }

// embutido no simu (Marcelo, 20/10: "a aba scope não está respeitando os temas"); o scope.js acompanha as trocas
try { const t = localStorage.getItem("maisim-tema") || "sistema";
  document.documentElement.dataset.tema = t === "escuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro"; }
catch (e) { document.documentElement.dataset.tema = "claro"; }
// a barra da janela do app (o MaiSim instalado) segue o tema: a cor do cabeçalho, clara ou escura
(function (m) { if (m) m.setAttribute("content", m.dataset[document.documentElement.dataset.tema === "escuro" ? "escuro" : "claro"]); })(document.querySelector('meta[name="theme-color"]'));
</script>

          background:var(--cartao); border:1px solid var(--borda); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.12); padding:8px; font-size:13px; }
  .menu .menu-topo { display:flex; gap:6px; align-items:center; position:sticky; top:-8px; background:var(--cartao); margin:-8px -8px 0; padding:6px 8px 4px; z-index:1; }
  .menu input.busca { flex:1; min-width:0; padding:2px 7px; font-size:12px; height:24px; box-sizing:border-box; }
  .menu .menu-fecha { flex:none; width:24px; height:24px; padding:0; border:0; background:transparent; color:var(--sutil); font-size:18px; line-height:1; cursor:pointer; border-radius:5px; }
  .menu .menu-fecha:hover { color:var(--texto, inherit); background:var(--borda); }
  .menu h4 { margin:8px 0 2px; font-size:12px; color:var(--sutil); text-transform:uppercase; letter-spacing:.03em; }
  .menu label { display:block; padding:1px 2px; cursor:pointer; }
  .menu .fino { color:var(--aviso2); font-size:11px; }
  .menu .item { display:flex; align-items:center; gap:4px; }
  .menu .item label { flex:1; }
  .menu .item .x { color:var(--sutil); }
  .menu input.ganho { width:62px; padding:1px 4px; font-size:12px; }
  .menu button.cor-sinal { width:16px; height:16px; padding:0; border-radius:50%; border:2px solid var(--cartao); box-shadow:0 0 0 1px var(--sutil); cursor:pointer; flex:0 0 auto; }
  .menu .paleta { display:flex; flex-wrap:wrap; gap:4px; padding:5px 4px 7px 22px; }
  .menu .paleta .amostra { width:18px; height:18px; padding:0; border-radius:4px; border:1px solid rgba(0,0,0,.15); cursor:pointer; }
  .menu .paleta .amostra.atual { outline:2px solid var(--texto); outline-offset:1px; }
  .menu .paleta-hex { display:flex; align-items:center; gap:4px; width:100%; margin-top:3px; }
  .menu .paleta-hex .hex { width:78px; font:12px ui-monospace, monospace; padding:1px 4px; } .menu .paleta-hex .hex.ruim { border-color:var(--erro-borda); background:var(--erro-bg); }
  .menu .paleta-hex .livre { width:26px; height:22px; padding:0; border:0; background:none; cursor:pointer; }
  .menu .paleta-hex .padrao { font-size:11px; padding:1px 6px; margin-left:auto; }
  .menu .espessuras { display:flex; align-items:center; gap:4px; width:100%; margin-top:4px; font-size:11px; color:var(--sutil); }
  .menu .espessuras .espessura { display:flex; align-items:center; width:30px; height:20px; padding:0 4px; border:1px solid var(--borda); border-radius:4px; background:none; cursor:pointer; }
  .menu button.abre-paleta { flex:none; display:inline-flex; align-items:center; padding:0 1px; margin-left:-2px; border:0; background:none; color:var(--sutil); cursor:pointer; }
  .menu button.abre-paleta svg { width:14px; height:14px; transform:rotate(-90deg); transition:transform .15s; }
  .menu button.abre-paleta.aberta svg { transform:none; } .menu button.abre-paleta:hover { color:var(--acento); }
  .menu .tracos { display:flex; align-items:center; gap:4px; width:100%; margin-top:4px; font-size:11px; color:var(--sutil); }
  .menu .tracos .traco { display:flex; align-items:center; justify-content:center; width:34px; height:20px; padding:0 3px; border:1px solid var(--borda); border-radius:4px; background:none; cursor:pointer; }
  .menu .tracos .traco.atual { outline:2px solid var(--texto); outline-offset:1px; }
  .menu .espessuras .espessura i { display:block; width:100%; border-radius:2px; } .menu .espessuras .espessura.atual { outline:2px solid var(--texto); outline-offset:1px; }
  .dica { font-size:12px; color:var(--sutil); margin:0 0 8px; }
  .vazio { color:var(--sutil); font-size:13px; padding:30px; text-align:center; }
  .aviso-amostra { color:var(--sutil); font-size:11.5px; padding:2px 10px 6px; }
  .menu-layout { position:relative; display:inline-block; }
  #menu-layout { position:absolute; top:calc(100% + 4px); left:0; z-index:40; display:flex; flex-direction:column; gap:2px; min-width:250px; padding:5px;
    background:var(--cartao); border:1px solid var(--borda); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  #menu-layout[hidden] { display:none; } #menu-layout button { text-align:left; border:0; background:none; padding:6px 9px; border-radius:6px; }
  #menu-layout button:hover { background:var(--suave2, rgba(0,0,0,.05)); }
  #janela-apagar { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:40px 16px 20px; box-sizing:border-box; }
  #janela-apagar.aberta { display:flex; }
  #janela-apagar .caixa { background:var(--cartao); border-radius:10px; width:min(820px, 100%); max-height:100%; display:flex; flex-direction:column;
           box-shadow:0 10px 40px rgba(0,0,0,.25); }
  #janela-apagar .topo, #janela-apagar .rodape { padding:10px 14px; display:flex; gap:10px; align-items:center; }
  #janela-apagar .topo { border-bottom:1px solid var(--borda); font-weight:600; }
  #janela-apagar .rodape { border-top:1px solid var(--borda); justify-content:flex-end; }
  #janela-apagar .lista { overflow:auto; padding:6px 14px; font-size:13px; flex:1 1 auto; min-height:0; }   /* a lista encolhe; o rodapé fica à vista (o zoom do MaiSim escala os vh) */
  #janela-apagar .topo, #janela-apagar .filtros, #janela-apagar .rodape, #janela-apagar label.orfas { flex:none; }
  #janela-apagar button.lixo { grid-row:1 / 3; grid-column:4; align-self:center; display:flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0;
                               border:1px solid transparent; background:none; color:var(--sutil); border-radius:6px; cursor:pointer; }
  #janela-apagar button.lixo:hover { color:#c0392b; border-color:#e8b4ad; } #janela-apagar button.lixo svg { width:15px; height:15px; }
  #ap-ok:disabled { opacity:.45; cursor:default; }
  #janela-apagar.apagando .lista, #janela-apagar.apagando .filtros, #janela-apagar.apagando label.orfas { pointer-events:none; opacity:.6; }   /* apagando: nada muda no meio */
  #janela-apagar label { display:grid; grid-template-columns: 22px 1fr 80px 30px; gap:6px; padding:4px 0; border-bottom:1px solid var(--suave2); cursor:pointer; }
  #janela-apagar .tam { text-align:right; color:var(--sutil); }
  #janela-apagar .cam { grid-column: 2 / 4; grid-row:2; color:var(--sutil); font-size:11px; }
  /* o filtro e "marcar todas (as filtradas)" (Marcelo, 22/10); as guardadas com selo; as pastas sem gravação embaixo */
  #janela-apagar .filtros { display:flex; gap:12px; align-items:center; padding:8px 14px 4px; }
  #janela-apagar .filtros input[type=search] { flex:1; padding:5px 8px; }
  #janela-apagar label.todas, #janela-apagar label.orfas { display:flex; grid-template-columns:none; border:0; gap:6px; align-items:center; white-space:nowrap; font-size:13px; }
  #janela-apagar label.orfas { padding:6px 14px; border-top:1px solid var(--borda); color:var(--sutil); }
  #janela-apagar label[hidden] { display:none; } #ap-vis { color:var(--sutil); }
  #janela-apagar .selo { font-size:10.5px; border:1px solid var(--borda); border-radius:9px; padding:0 6px; margin-left:6px; color:var(--sutil); }
  button.perigo { background:#b42318; color:#fff; border-color:#b42318; }
  /* as perguntas no padrão do MaiSim (pergunta(), scope.js): por cima da janela de apagar */
  .sc-modal-fundo { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
  .sc-modal { background:var(--cartao); color:var(--texto); border-radius:10px; width:min(480px, 92vw); padding:16px 18px 14px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .sc-modal h3 { margin:0 0 8px; font-size:16px; } .sc-modal p { margin:0 0 14px; font-size:13.5px; line-height:1.45; color:var(--sutil); }
  .sc-modal .sc-bts { display:flex; justify-content:flex-end; gap:8px; } .sc-modal button { padding:5px 14px; border-radius:7px; }
  @media (max-width: 900px) { #paineis > .cartao { grid-column: 1 / -1; } #indice { flex-basis:180px; } }
  /* o painel XY (vetor espacial, U–Z·i, livre): a sua configuração (XY ▾) e o ⓘ; sem as ferramentas do tempo */
  .cartao:not(.xy) .b-xy, .cartao:not(.xy) .b-xyi, .cartao:not(.xy) .xy-ajuda { display:none; }
  .cartao.xy .b-sinais, .cartao.xy .b-y, .cartao.xy .zoom, .cartao.xy .b-solto, .cartao.xy .b-med { display:none; }
  .cab .b-xyi { font:italic 700 13px Georgia, "Times New Roman", serif; border-radius:50%; width:24px; height:24px; padding:0; }   /* o (i) da ajuda */
  .xy-ajuda { font-size:12px; color:var(--sutil); border:1px dashed var(--borda); border-radius:6px; padding:4px 10px; margin:0 0 6px; }
  .xy-ajuda p { margin:4px 0; }
  .xy-leitura { display:flex; flex-wrap:wrap; gap:3px 14px; font-size:12px; padding:3px 6px; min-height:18px; }
  .xy-leitura i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }
  .xy-leitura .sutil, .xy-est { color:var(--sutil); }
  .menu-xy { width:310px; display:flex; flex-direction:column; gap:6px; }
  .menu-xy label { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; }
  .menu-xy select { flex:1; min-width:0; } .menu-xy input[type=number] { width:76px; }
  .menu-xy .seg { display:flex; gap:4px; flex-wrap:wrap; } .menu-xy .seg button { font-size:12px; padding:2px 8px; }
  .menu-xy .rec { padding-left:20px; }
  .menu-xy .xy-par, .menu-xy .xy-th { display:flex; flex-direction:column; gap:4px; border-left:2px solid var(--borda); padding-left:8px; }
</style>
</head>
<body>
<header>
  <div class="linha">
    <h1>Scope</h1>
    <div class="grupo so-aberto"><button id="bt-vivo" class="ativo" data-tr="scope.h.vivo">Ao vivo</button><button id="bt-comparar" data-tr="scope.h.comparar">Comparar</button></div>
    <div class="grupo so-aberto"><label>A <select id="sel-a" class="sel-rodada"></select></label>
      <label>B <select id="sel-b" class="sel-rodada"></select></label><button id="bt-carregar" data-tr="scope.h.carregar">Carregar</button></div>
    <span id="status">aguardando…</span>   <!-- o scope.js escreve (no idioma) -->
  </div>
  <div class="linha">
    <button id="bt-indice" title="índice das seções e painéis, ao lado (clique para ir direto a um gráfico)" data-tr-title="scope.h.t_indice" data-tr="scope.h.indice">☰ Índice</button>
    <label class="so-aberto" title="durante a rodada ao vivo, não reajusta as escalas" data-tr-title="scope.h.t_fixar" data-tr="scope.h.fixar"><input type="checkbox" id="ck-fixar"> Fixar eixos</label>
    <label class="so-aberto" title="para de redesenhar (os dados continuam chegando)" data-tr-title="scope.h.t_pausar" data-tr="scope.h.pausar"><input type="checkbox" id="ck-pausar"> Pausar</label>
    <div class="grupo">
      <button id="bt-painel" data-tr="scope.h.painel">+ Painel</button>
      <button id="bt-painel-xy" title="painel XY: um sinal contra outro, o vetor espacial (αβ, dq) de três fases ou o diagrama U–Z·i do Gecko" data-tr-title="scope.h.t_painel_xy" data-tr="scope.h.painel_xy">+ Painel XY</button>
      <button id="bt-secao" title="novo título de seção no fim" data-tr-title="scope.h.t_secao" data-tr="scope.h.secao">+ Seção</button>
      <button id="bt-porlinha" title="quantos painéis por linha, para todos (cada painel muda o seu no menu ⋯)" data-tr-title="scope.h.t_porlinha" data-tr-js>Por linha: 2</button>
      <span class="menu-layout so-aberto"><button id="bt-layout" title="o layout deste circuito: guardar como padrão, voltar ao padrão, ou o automático" data-tr-title="scope.h.t_layout">Layout ▾</button>
        <span id="menu-layout" hidden><button id="ml-guardar" title="guarda o layout de agora como o padrão do circuito, ao lado dele (vai junto com o circuito)" data-tr-title="scope.h.t_ml_guardar" data-tr="scope.h.ml_guardar">Guardar como padrão deste circuito</button>
        <button id="ml-padrao" title="volta ao padrão guardado do circuito (o que você mexeu depois sai)" data-tr-title="scope.h.t_ml_padrao" data-tr="scope.h.ml_padrao">Voltar ao padrão</button>
        <button id="bt-padrao" title="o layout automático: um painel com os sinais da rodada (o dos outros circuitos fica)" data-tr-title="scope.h.t_bt_padrao" data-tr="scope.h.bt_padrao">Automático (os sinais da rodada)</button></span></span>
      <button id="bt-exportar" class="so-aberto" title="baixa um arquivo com os painéis, as seções e as cores dos sinais (para outro MaiSim ou um colega)" data-tr-title="scope.h.t_exportar" data-tr="scope.h.exportar">Exportar visões</button>
      <button id="bt-importar" class="so-aberto" title="troca os painéis, as seções e as cores pelos de um arquivo exportado (do MaiSim ou do PEW)" data-tr-title="scope.h.t_importar" data-tr="scope.h.importar">Importar visões…</button>
      <input type="file" id="arq-visoes" accept=".json,application/json" hidden>
      <button id="bt-salvar" class="so-aberto" title="salva todos os painéis numa imagem PNG" data-tr-title="scope.h.t_salvar" data-tr="scope.h.salvar">Salvar figura</button>
      <button id="bt-apagar" class="so-aberto" title="escolher gravações (scope_*.npz) para apagar do disco" data-tr-title="scope.h.t_apagar" data-tr="scope.h.apagar">Apagar gravações…</button>
    </div>
    <button id="bt-ajuda" class="so-aberto" data-tr-title="scope.h.t_ajuda" title="Zoom em cada painel: escolha X (tempo), Y (vertical) ou área e arraste no gráfico; o enquadrar (os quatro cantos) ou duplo clique volta a ver tudo naquele painel.
Ctrl + roda: zoom no tempo. Ctrl + Shift + roda: vertical.
O tempo é comum aos painéis ligados (corrente); clique na corrente para dar a um painel o seu próprio tempo (corrente partida, laranja).
Medir: média, série de Fourier, THD e espectro num intervalo; Shift + arrastar no gráfico escolhe o intervalo.
Sinais ▾ troca as variáveis; Y fixo guarda uma escala vertical; ⋯ tem largura, altura e PNG do painel.
A alça ⠿ arrasta o painel para outro lugar, outra seção ou para uma seção no índice; a ⠿ da seção a leva inteira, com os painéis (no índice, arraste o nome da seção).
A seta ▾ recolhe a seção (os painéis somem até abrir de novo) ou o painel (fica só o título); fica guardado no layout.
⤢ expande o painel para a janela inteira; Esc, ⤡ ou um clique fora volta.
Sinais de passo fino (pulsos, tensões PWM, medidas do Gecko) aparecem a cada 1 µs com zoom abaixo de 40 ms; com zoom maior, como média em cada janela de 20 µs.
A em cores; B em preto tracejado.">?</button>
    <button id="bt-cab" aria-expanded="true" title="recolher o cabeçalho: numa linha, só a rodada e + Painel, + Painel XY, + Seção, Por linha" data-tr-title="scope.h.t_cab_recolher">▴</button>
  </div>
</header>
<div id="corpo">
<nav id="indice"><label class="unica" title="mostra só a seção escolhida no índice, como abas" data-tr-title="scope.h.t_unica"><input type="checkbox" id="ck-unica"> <span data-tr="scope.h.unica">Uma seção por vez</span></label>
  <div class="lista"></div></nav>
<main>
  <div id="paineis"></div>
  <div id="so-vazio" class="vazio" hidden data-tr="scope.h.so_vazio">Aguardando os sinais da rodada… inicie a simulação no simu (Simulação ▸ Iniciar, ou Ctrl+Enter).</div>
</main>
</div>
<div id="fundo-exp" hidden></div>
<div id="janela-apagar"><div class="caixa">
  <div class="topo" data-tr="scope.h.ap_topo">Apagar gravações do maisim-scope <span id="ap-total" style="font-weight:400;color:var(--sutil)"></span></div>
  <div class="filtros"><input id="ap-filtro" type="search" placeholder="filtrar: circuito, nome da rodada, data (ex.: 22/10)…" aria-label="filtrar as gravações" data-tr-ph="scope.h.ph_ap_filtro" data-tr-aria="scope.h.a_ap_filtro">
    <label class="todas" data-tr="scope.h.ap_todas"><input type="checkbox" id="ap-todas"> Marcar todas <span id="ap-vis"></span></label></div>
  <div class="lista" id="ap-lista"></div>
  <label class="orfas" id="ap-orfas-l" hidden><input type="checkbox" id="ap-orfas"> <span id="ap-orfas-t"></span></label>
  <div class="rodape"><span id="ap-marcadas" style="margin-right:auto;color:var(--sutil)"></span>
    <button id="ap-fechar" data-tr="scope.cancelar">Cancelar</button><button id="ap-ok" class="perigo">Apagar marcadas</button>   <!-- o ap-ok: o scope.js escreve --></div>
</div></div>
<script src="static/uPlot.iife.min.js"></script>
<script src="static/scope.js"></script>
<!-- menu lateral do MaiSim, servido pela página do MaiSim; aberta direto na 7102, a página segue sem ele -->
<script src="static/maisim-dica.js"></script>   <!-- as dicas do MaiSim (app/public: a mesma em todas as páginas) -->
<script src="/maisim-nav.js" onerror="this.remove()"></script>
</body>
</html>
