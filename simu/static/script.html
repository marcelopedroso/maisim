<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48 256x256">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#6d28d9" data-claro="#ffffff" data-escuro="#171a21">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaiSim · script</title>
<script>
// tema e tamanho do MaiSim (o trilho escolhe e guarda), antes de pintar: o mesmo das outras páginas
try { const t = localStorage.getItem("maisim-tema") || "sistema";
  document.documentElement.dataset.tema = t === "escuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro"; }
catch (e) { document.documentElement.dataset.tema = "claro"; }
(function (m) { if (m) m.setAttribute("content", m.dataset[document.documentElement.dataset.tema === "escuro" ? "escuro" : "claro"]); })(document.querySelector('meta[name="theme-color"]'));
try { const z = parseFloat(localStorage.getItem("maisim-escala")); if (window.top === window.self && [0.8, 0.9, 1.1, 1.25, 1.4].includes(z)) document.documentElement.style.zoom = z; } catch (e) { /* 1 */ }
</script>
<script src="static/maisim-i18n.js"></script>
<script src="static/textos_script.js"></script>
<style>
  :root { --fundo:#f7f8fa; --cartao:#fff; --texto:#1b1f24; --sutil:#5b6470; --borda:#d9dde3; --acento:#6d28d9; --campo:#fff;
          --suave:#eef2f6; --ok:#1b7f2a; --erro:#b42318; --aviso:#8a5300; --aviso-bg:#fff7e6; --aviso-borda:#f5d39b; --acento-suave:#f1edff; color-scheme:light; }
  :root[data-tema="escuro"] { --fundo:#0f1115; --cartao:#171a21; --texto:#e6e8ec; --sutil:#9aa3ae; --borda:#2c323c; --acento:#8b5cf6; --campo:#1d212a;
          --suave:#232833; --ok:#4ade80; --erro:#f87171; --aviso:#fcd34d; --aviso-bg:#33280f; --aviso-borda:#6b5419; --acento-suave:#2b2440; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--fundo); color:var(--texto); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #pagina { position:absolute; inset:0 var(--ia-aberta, 0px) 0 var(--maisim-nav-w, 0px); display:grid; grid-template-columns:240px 1fr; min-width:0; }
  aside { border-right:1px solid var(--borda); background:var(--cartao); overflow:auto; padding:12px; }
  aside h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--sutil); margin:14px 4px 6px; font-weight:600; }
  .novos { display:flex; gap:6px; } .novos button { white-space:nowrap; padding:8px 8px; } .novos #bt-novo { flex:1 1 auto; } .novos #bt-pasta { flex:0 0 auto; width:auto; }
  aside h2 button.raiz { all:unset; cursor:pointer; padding:1px 4px; border-radius:4px; } aside h2 button.raiz.sel { background:var(--acento-suave); color:var(--acento); }
  .arvore ul { list-style:none; margin:0; padding:0 0 0 14px; border-left:1px solid var(--borda); margin-left:10px; }
  .arvore li.pasta > .linha { display:flex; align-items:center; }
  .arvore li.pasta > .linha > button.abre { flex:1 1 auto; font-weight:600; }
  .arvore li.pasta > .linha > button.abre.sel { background:var(--acento-suave); color:var(--acento); }
  .arvore li.pasta:not(.aberta) > ul { display:none; }
  .arvore .seta { display:inline-block; width:12px; color:var(--sutil); transition:transform .1s; } .arvore li.pasta.aberta > .linha .seta { transform:rotate(90deg); }
  .arvore .alvo, aside h2 button.raiz.alvo { outline:2px dashed var(--acento); outline-offset:-2px; background:var(--acento-suave); }
  .arvore [draggable="true"] { cursor:grab; }
  .arvore button.tira { flex:0 0 auto; width:auto; padding:2px 6px; visibility:hidden; color:var(--sutil); }
  .arvore li.pasta > .linha:hover button.tira, .arvore button.tira:focus { visibility:visible; } .arvore button.tira:hover { color:var(--erro); } .arvore button.tira.mover:hover { color:var(--acento); }
  aside button.novo { width:100%; padding:8px 10px; border:1px solid var(--acento); color:var(--acento); background:var(--cartao); border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  aside ul { list-style:none; margin:0; padding:0; }
  aside li button { width:100%; text-align:left; padding:6px 8px; border:0; background:none; color:inherit; font:inherit; border-radius:6px; cursor:pointer;
                    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  aside li button:hover { background:var(--suave); }
  aside li button[aria-current="true"] { background:var(--acento-suave); color:var(--acento); font-weight:600; }
  aside .vazio { color:var(--sutil); font-size:13px; padding:4px 8px; }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }   /* em coluna: sem o aviso, o editor ocupa o lugar dele */
  .barra { display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--borda); background:var(--cartao); flex-wrap:nowrap; }
  .barra button { flex:0 0 auto; white-space:nowrap; }
  .barra input { flex:1 1 180px; min-width:90px; padding:7px 9px; border:1px solid var(--borda); border-radius:7px; background:var(--campo); color:inherit; font:inherit; font-weight:600; }
  .barra button { padding:7px 12px; border:1px solid var(--borda); border-radius:7px; background:var(--cartao); color:inherit; font:inherit; cursor:pointer; }
  .barra button.prim { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  .barra button:disabled { opacity:.5; cursor:default; }
  /* Apagar em vermelho, para chamar a atenção (Marcelo, 17/11); cheio ao passar o mouse; desligado continua apagado */
  .barra button.perigo:not(:disabled) { color:var(--erro); border-color:var(--erro); font-weight:600; }
  .barra button.perigo:not(:disabled):hover { background:#dc2626; border-color:#dc2626; color:#fff; }
  #estado { color:var(--sutil); font-size:13px; min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #estado.nao-salvo { color:var(--erro); font-weight:600; }
  .aviso button { margin-left:10px; padding:1px 8px; border:1px solid var(--aviso-borda); border-radius:6px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
  .aviso[hidden] { display:none; }
  .aviso { margin:0; padding:6px 12px; font-size:12.5px; color:var(--aviso); background:var(--aviso-bg); border-bottom:1px solid var(--aviso-borda); }
  #editor { flex:1 1 0; min-height:0; position:relative; }
  #editor textarea { position:absolute; inset:0; width:100%; height:100%; border:0; resize:none; padding:10px 12px; background:var(--campo); color:inherit;
                     font:13px/1.5 ui-monospace, Consolas, monospace; white-space:pre; tab-size:4; outline:none; }
  #saida-box { border-top:1px solid var(--borda); background:var(--cartao); display:flex; flex-direction:column; flex:0 0 var(--h-saida, 34%); min-height:120px; position:relative; }
  #saida-box.recolhida { flex:0 0 auto; min-height:0; } #saida-box.recolhida #saida { display:none; }
  /* as bordas de arrastar (Marcelo, 17/11: "como no VS Code"): a de cima da Saída e a da esquerda da gaveta da IA */
  .borda-arrasta { position:absolute; z-index:5; } .borda-arrasta:hover, .borda-arrasta.arrastando { background:color-mix(in srgb, var(--acento) 35%, transparent); }
  #saida-borda { left:0; right:0; top:-4px; height:8px; cursor:row-resize; } #saida-box.recolhida #saida-borda { display:none; }
  #ia-borda { left:-4px; top:0; bottom:0; width:8px; cursor:col-resize; }
  #saida-box .cab .bts { display:flex; align-items:center; gap:8px; }
  #bt-saida { border:1px solid var(--borda); background:var(--cartao); color:var(--sutil); border-radius:6px; width:24px; height:22px; padding:0; font:inherit; font-size:15px; line-height:1; cursor:pointer; }
  #bt-saida:hover { color:var(--texto); }
  body.arrastando-borda { user-select:none; }
  #saida-box .cab { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 12px; border-bottom:1px solid var(--borda); }
  #saida-box .cab b { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--sutil); }
  #resultado { font-size:13px; } #resultado.ok { color:var(--ok); } #resultado.erro { color:var(--erro); }
  #saida { margin:0; padding:8px 12px; overflow:auto; flex:1; font:12.5px/1.45 ui-monospace, Consolas, monospace; white-space:pre-wrap; }
  #saida .err { color:var(--erro); } #saida .dica { color:var(--sutil); font-family:system-ui, sans-serif; }
  #saida a { color:var(--acento); }
  /* as janelas do MaiSim (as mesmas do simu: modal-fundo, modal), no lugar dos confirm()/prompt() do navegador */
  .modal-fundo { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.35); display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; animation:aparece .12s ease-out; }
  @keyframes aparece { from { opacity:0; } to { opacity:1; } }
  .modal { background:var(--cartao); color:var(--texto); border-radius:14px; box-shadow:0 24px 60px rgba(15,23,42,.28); width:min(420px, 92vw); padding:18px 20px 16px; font-size:14px; }
  .modal h3 { margin:0 0 6px; font-size:16px; } .modal p { margin:4px 0 12px; color:var(--sutil); line-height:1.45; }
  .modal input { width:100%; font:inherit; font-size:13.5px; padding:7px 9px; border:1px solid var(--borda); border-radius:7px; background:var(--campo); color:inherit; }
  .modal select.m-lista { width:100%; font:inherit; font-size:13.5px; padding:7px 9px; border:1px solid var(--borda); border-radius:7px; background:var(--campo); color:inherit; }
  .modal input:focus { outline:2px solid var(--acento-suave); border-color:var(--acento); } .modal input.invalido { border-color:var(--erro); }
  .modal .m-erro { color:var(--erro); font-size:12px; min-height:16px; margin-top:4px; }
  .modal-botoes { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .modal-botoes button { padding:6px 14px; border-radius:8px; font:inherit; font-size:13px; border:1px solid var(--borda); background:var(--cartao); color:inherit; cursor:pointer; }
  .modal-botoes button.primario { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  .modal-botoes button.perigo { background:#dc2626; border-color:#dc2626; color:#fff; font-weight:600; }
  /* a IA do MaiSim (a mesma do simu: o botão flutuante com o mascote e a gaveta da direita) */
  #bt-ia { position:fixed; right:18px; bottom:18px; z-index:65; width:52px; height:52px; border-radius:50%; padding:0; display:grid; place-items:center;
    background:var(--acento); color:#fff; border:0; box-shadow:0 6px 18px rgba(15,23,42,.25); cursor:pointer; }
  #bt-ia:hover { filter:brightness(1.08); } #bt-ia[hidden] { display:none; }
  #bt-ia .ponto { position:absolute; top:4px; right:4px; width:12px; height:12px; border-radius:50%; background:#22c55e; border:2px solid var(--cartao); display:none; }
  #bt-ia.proposta .ponto { display:block; } #bt-ia.trabalhando { animation:ia-pulsa 1.4s ease-in-out infinite; }
  @keyframes ia-pulsa { 50% { box-shadow:0 0 0 8px color-mix(in srgb, var(--acento) 25%, transparent), 0 6px 18px rgba(15,23,42,.25); } }
  #gaveta-ia { position:fixed; top:0; right:0; bottom:0; width:var(--w-ia, 420px); max-width:100vw; z-index:70; display:flex; flex-direction:column;
    background:var(--cartao); border-left:1px solid var(--borda); }
  #gaveta-ia[hidden] { display:none; }
  .ia-topo { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--borda); }
  .ia-topo b { flex:1; font-size:14px; } .ia-topo button { padding:4px 9px; border:1px solid var(--borda); border-radius:7px; background:var(--cartao); color:inherit; font:inherit; font-size:12.5px; cursor:pointer; }
  .mascote { color:var(--acento); flex:0 0 auto; }
  #ia-msgs { flex:1; overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; font-size:13.5px; line-height:1.45; }
  #ia-msgs .vazio { color:var(--sutil); }
  .ia-eu { align-self:flex-end; max-width:88%; background:var(--acento-suave); border-radius:12px 12px 2px 12px; padding:7px 10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .ia-ela { max-width:100%; overflow-wrap:anywhere; } .ia-ela p { margin:0 0 6px; } .ia-ela ul { margin:0 0 6px; padding-left:20px; }
  .ia-ela pre, .ia-dif pre { margin:4px 0; padding:7px 9px; background:var(--suave); border-radius:7px; overflow:auto; font:12px/1.4 ui-monospace, Consolas, monospace; }
  .ia-ela code { font:12px ui-monospace, Consolas, monospace; background:var(--suave); padding:0 3px; border-radius:4px; } .ia-ela pre code { background:none; padding:0; }
  .ia-ela .md-h { font-weight:700; margin:6px 0 4px; }
  .ia-meta { color:var(--sutil); font-size:11.5px; } .ia-erro { color:var(--erro); } .ia-aplicada { color:var(--ok); font-weight:600; }
  .ia-andamento { color:var(--sutil); font-size:12.5px; } .ia-andamento ul { margin:4px 0 0; padding-left:18px; }
  .ia-cartao { border:1px solid var(--borda); border-radius:10px; padding:9px 10px; background:var(--fundo); }
  .ia-cartao h4 { margin:0 0 6px; font-size:13px; } .ia-arq { margin:6px 0; } .ia-arq summary { cursor:pointer; font:12.5px ui-monospace, Consolas, monospace; }
  .ia-arq .novo { color:var(--ok); font-family:system-ui, sans-serif; font-size:11px; margin-left:6px; } .ia-arq .sint { color:var(--erro); font-family:system-ui, sans-serif; font-size:11.5px; display:block; }
  .ia-dif pre { max-height:300px; } .ia-dif .mais { color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent); display:block; }
  .ia-dif .menos { color:var(--erro); background:color-mix(in srgb, var(--erro) 10%, transparent); display:block; } .ia-dif .igual { display:block; color:var(--sutil); }
  .ia-bts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .ia-bts button, .ia-pe button { padding:6px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--cartao); color:inherit; font:inherit; font-size:13px; cursor:pointer; }
  .ia-bts button.primario, .ia-pe button.primario { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  .ia-bts button:disabled, .ia-pe button:disabled { opacity:.5; cursor:default; }
  .ia-pe { border-top:1px solid var(--borda); padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .ia-pe textarea { width:100%; min-height:62px; max-height:220px; resize:vertical; font:inherit; font-size:13.5px; padding:7px 9px; border:1px solid var(--borda); border-radius:8px; background:var(--campo); color:inherit; }
  .ia-pe .linha { display:flex; gap:6px; align-items:center; } .ia-pe select { font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--borda); border-radius:7px; background:var(--campo); color:inherit; }
  .ia-pe .linha .esp { flex:1; }
  .ia-aviso { margin:8px 12px 0; padding:7px 10px; font-size:12.5px; border-radius:8px; color:var(--aviso); background:var(--aviso-bg); border:1px solid var(--aviso-borda); }
  .ia-aviso[hidden] { display:none; } .ia-aviso a { color:inherit; font-weight:600; }
  @media (max-width:720px) { .barra { flex-wrap:wrap; } #pagina { grid-template-columns:1fr; grid-template-rows:auto 1fr; } aside { max-height:30vh; border-right:0; border-bottom:1px solid var(--borda); } }
</style>
</head>
<body>
<div id="pagina">
  <aside>
    <div class="novos">
      <button type="button" class="novo" id="bt-novo" data-tr="scr.novo" data-tr-title="scr.novo_title">+ Novo script</button>
      <button type="button" class="novo" id="bt-pasta" data-tr="scr.nova_pasta" data-tr-title="scr.nova_pasta_title">+ Pasta</button>
    </div>
    <h2><button type="button" id="raiz-meus" class="raiz" data-recebe="" data-tr="scr.meus" data-tr-title="scr.raiz_title">Meus scripts</button></h2>
    <ul id="lista-meus" class="arvore"></ul>
    <h2 data-tr="scr.exemplos">Exemplos</h2>
    <ul id="lista-exemplos" class="arvore"></ul>
  </aside>
  <main>
    <div class="barra">
      <input id="nome" aria-label="nome do script" data-tr-aria="scr.nome" spellcheck="false" autocomplete="off">
      <span id="estado"></span>
      <button type="button" id="bt-salvar" data-tr="scr.salvar" data-tr-title="scr.salvar_title">Salvar</button>
      <button type="button" id="bt-rodar" class="prim" data-tr="scr.rodar" data-tr-title="scr.rodar_title">▶ Rodar</button>
      <button type="button" id="bt-scope" data-tr="scr.ver_scope" data-tr-title="scr.ver_scope_title" disabled>Ver no Scope</button>
      <button type="button" id="bt-mover" data-tr="scr.mover_bt" data-tr-title="scr.mover_bt_title">Mover…</button>
      <button type="button" id="bt-apagar" class="perigo" data-tr="scr.apagar">Apagar</button>
    </div>
    <p class="aviso" id="aviso"><span data-tr="scr.aviso">O script roda como um programa Python nesta máquina, com acesso aos seus arquivos. Rode só scripts em que você confia.</span>
      <button type="button" id="bt-aviso" data-tr="scr.aviso_ok">Entendi</button></p>
    <div id="editor"></div>
    <div id="saida-box">
      <div class="borda-arrasta" id="saida-borda" data-tr-title="scr.borda_saida" title="arraste para mudar a altura; duplo clique: volta ao tamanho de antes"></div>
      <div class="cab"><b data-tr="scr.saida">Saída</b><span class="bts"><span id="resultado"></span>
        <button type="button" id="bt-saida" data-tr-title="scr.saida_recolher" data-tr-aria="scr.saida_recolher" title="minimizar a saída" aria-expanded="true">−</button></span></div>
      <pre id="saida"></pre>
    </div>
  </main>
</div>
<button type="button" id="bt-ia" data-tr-title="scr.ia_bt" data-tr-aria="scr.ia_titulo" title="IA do MaiSim" aria-label="IA do MaiSim">
  <svg class="mascote" width="26" height="26" aria-hidden="true" style="color:#fff"><use href="#maisim-claude"/></svg><span class="ponto"></span></button>
<aside id="gaveta-ia" hidden aria-label="IA do MaiSim" data-tr-aria="scr.ia_titulo">
  <div class="borda-arrasta" id="ia-borda" data-tr-title="scr.borda_ia" title="arraste para mudar a largura; duplo clique: larga ou estreita"></div>
  <div class="ia-topo"><svg class="mascote" width="21" height="21" aria-hidden="true"><use href="#maisim-claude"/></svg>
    <b data-tr="scr.ia_titulo">IA do MaiSim</b>
    <button type="button" id="ia-nova" data-tr="scr.ia_nova" data-tr-title="scr.ia_nova_title">Nova conversa</button>
    <button type="button" id="ia-fecha" data-tr-aria="scr.ia_fechar" data-tr-title="scr.ia_fechar" aria-label="Fechar">×</button></div>
  <div class="ia-aviso" id="ia-aviso" hidden></div>
  <div id="ia-msgs" aria-live="polite"></div>
  <div class="ia-pe">
    <textarea id="ia-texto" data-tr-ph="scr.ia_placeholder" data-tr-aria="scr.ia_placeholder" placeholder="Peça à IA…"></textarea>
    <div class="linha"><select id="ia-qual" hidden data-tr-aria="scr.ia_qual"></select><select id="ia-modelo" data-tr-aria="scr.ia_modelo"></select><span class="esp"></span>
      <button type="button" id="ia-parar" hidden data-tr="scr.ia_parar">Parar</button>
      <button type="button" id="ia-enviar" class="primario" data-tr="scr.ia_enviar">Enviar</button></div>
  </div>
</aside>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="maisim-claude" viewBox="0 0 24 24">
    <path d="M4.5 4.5h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8.5l-4.5 3.6v-3.6h-2a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="var(--diodo-fundo, #ede9fe)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M6 11.2H8.1M13.6 11.2H15.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8.1 8L13 11.2L8.1 14.4Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M13.6 8V14.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M17.6 5.9C17.8 7.3 18.15 7.65 19.55 7.85 18.15 8.05 17.8 8.4 17.6 9.8 17.4 8.4 17.05 8.05 15.65 7.85 17.05 7.65 17.4 7.3 17.6 5.9Z" fill="currentColor"/>
  </symbol></defs></svg>
<script src="static/script.js"></script>
<script src="static/script_ia.js"></script>
<script src="/maisim-nav.js" onerror="this.remove()"></script>
</body>
</html>
