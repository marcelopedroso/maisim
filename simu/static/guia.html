<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title data-tr="guia.titulo">Guia do Controle</title>
<!-- o guia do controle (GUIA_CONTROLE.md, servido em /maisim/simu/guia), renderizado; sem a biblioteca, o texto puro -->
<script>
// o tema do MaiSim (o trilho escolhe; localStorage "maisim-tema"): sistema, claro ou escuro
try { const t = localStorage.getItem("maisim-tema") || "sistema";
  document.documentElement.dataset.tema = t === "escuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro"; }
catch (e) { /* claro */ }
</script>
<script src="maisim-i18n.js"></script>
<script data-src="maisim-i18n.js">/* reserva: sem o maisim-i18n.js (a conexão caiu), o português; tenta de novo e o de verdade assume */window.maisimI18n||(function(){var d={},o=[],h=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})},f=function(k,p){var e=d[k],v=e?e.pt:k;if(v&&typeof v==="object")v=p&&p.n===1?v.one:v.other;return p?String(v).replace(/\{(\w+)\}/g,function(m,x){return x in p?(/_html$/.test(k)?h(p[x]):String(p[x])):m}):v};window.maisimI18n={reserva:true,add:function(x){for(var k in x)d[k]=x[k]},dicionario:function(){return d},tr:f,tem:function(k){return k in d},lingua:function(){return"pt"},local:function(){return"pt-BR"},muda:function(){},aoMudar:function(g){o.push(g)},ouvintes:function(){return o},aplica:function(){},data:function(x,o){return new Date(x).toLocaleString("pt-BR",o)},hora:function(x,o){return new Date(x).toLocaleTimeString("pt-BR",o||{hour:"2-digit",minute:"2-digit"})},num:function(x,o){return Number(x).toLocaleString("pt-BR",o)},escH:function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}};window.tr=f;var s=document.createElement("script");s.src=document.currentScript.getAttribute("data-src");s.async=false;document.head.appendChild(s)})()</script>  <!-- português e inglês (o idioma do trilho) -->

<style>
  :root { --texto:#1f2328; --sutil:#59636e; --borda:#d1d9e0; --fundo:#ffffff; --codigo:#f6f8fa; --link:#0b5cad; --erro:#b42318; }
  :root[data-tema="escuro"] { --texto:#e6e9ee; --sutil:#9aa4af; --borda:#3a424c; --fundo:#15191e; --codigo:#1f252c; --link:#a78bfa; --erro:#f97066; color-scheme:dark; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:920px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:26px; border-bottom:1px solid var(--borda); padding-bottom:8px; }
  h2 { font-size:20px; margin-top:32px; border-bottom:1px solid var(--borda); padding-bottom:4px; }
  h3 { font-size:16.5px; margin-top:24px; }
  a { color:var(--link); }
  code { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--codigo); padding:1px 5px; border-radius:4px; }
  pre { background:var(--codigo); padding:12px 14px; border-radius:6px; overflow-x:auto; line-height:1.45; }
  pre code { background:none; padding:0; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; margin:12px 0; font-size:14px; }
  th, td { border:1px solid var(--borda); padding:6px 10px; vertical-align:top; text-align:left; }
  th { background:var(--codigo); }
  li { margin:3px 0; }
  .erro { color:var(--erro); border:1px solid currentColor; border-radius:6px; padding:8px 12px; }
</style>

<body>
<main id="guia">carregando o guia…</main>
<script>
// o guia vem no idioma do cookie (a rota /guia escolhe o .md); ao trocar o idioma, carrega de novo no mesmo ponto: os títulos
// dos dois .md são os mesmos, na mesma ordem (a trava lingua_offline.py confere), então o índice do título acha o lugar.
// O <main> não leva data-tr: o aplica() da troca de idioma escreveria o "carregando" por cima do guia já mostrado.
const el = document.getElementById("guia");
const TITULOS = "h1, h2, h3";
let pedido = 0, mostrado = false;                 // pedido: só a resposta do último vale; mostrado: há um guia na tela
function ancora() {                               // o último título acima do topo da janela (-1: nenhum)
  let i = -1;
  el.querySelectorAll(TITULOS).forEach((h, k) => { if (h.getBoundingClientRect().top <= 1) i = k; });
  return i;
}
function mostra(md) {
  if (window.marked) {
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("table").forEach((t) => { const d = document.createElement("div"); d.className = "tabela"; t.replaceWith(d); d.appendChild(t); });
  } else {
    const pre = document.createElement("pre"); pre.textContent = md; el.replaceChildren(pre);
  }
}
async function carrega() {
  const meu = ++pedido;
  const i = mostrado ? ancora() : -1, y = window.scrollY;
  if (!mostrado) el.textContent = tr("guia.carregando");   // só na primeira vez; depois o guia fica até o novo chegar
  try {
    const r = await fetch("../guia");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const md = await r.text();
    if (meu !== pedido) return;                   // chegou atrasado: um pedido mais novo já saiu
    mostra(md);
    if (mostrado) {
      const h = i >= 0 && el.querySelectorAll(TITULOS)[i];
      if (h) h.scrollIntoView(); else window.scrollTo(0, y);
    }
    mostrado = true;
  } catch (e) {
    if (meu !== pedido) return;
    const msg = tr("guia.erro", { erro: e.message });
    if (!mostrado) { el.textContent = msg; return; }
    let av = document.getElementById("guia-erro");   // o guia de antes fica; o erro vai em cima dele
    if (!av) { av = document.createElement("p"); av.id = "guia-erro"; av.className = "erro"; el.prepend(av); }
    av.textContent = msg;
  }
}
carrega();
maisimI18n.aoMudar(carrega);
</script>
</body>
</html>
