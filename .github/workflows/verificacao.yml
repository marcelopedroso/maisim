# A verificação de cada PR: o conjunto rápido dos testes (simu/validacao/ci.sh rapido) na instância de teste. Passou →
# o próprio Actions junta o PR no main (squash, o ramo apagado) e chama a bateria inteira (bateria.yml) — só PR do dono
# do repositório, de um ramo dele, fora de rascunho e sem o rótulo "nao-juntar"; PR de outra pessoa espera a revisão.
# O merge só vale para o commit que foi testado (--match-head-commit: um commit novo no meio do caminho é recusado), e
# roda também quando um rascunho fica pronto (ready_for_review). Antes de juntar, espera a revisão do Codex terminar e
# recusa o merge com conversas abertas (.github/scripts/espera_codex.py). merge_group: a verificação também na fila de merge do
# GitHub, se um dia for ligada. (Um merge feito pelo token do Actions não dispara o "push" de outros workflows; o
# workflow_dispatch, sim.)
name: verificação

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: testes (conjunto rápido)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepara
      - name: os testes
        run: bash simu/validacao/ci.sh rapido
      - name: o resumo
        if: always()
        run: |
          { echo '```'; cat ~/.cache/maisim_teste/bateria/resumo.txt 2>/dev/null || echo "(sem resumo)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: os registros e as fotos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registros-verificacao
          path: |
            ~/.cache/maisim_teste/bateria/
            ~/.cache/maisim_teste/*.log
          retention-days: 14
          if-no-files-found: ignore

  juntar:
    name: juntar no main
    needs: testes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == github.repository_owner
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'nao-juntar')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: espera a revisão do Codex e confere as conversas
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/espera_codex.py
      - name: squash no main e a bateria inteira
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTADO: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$TESTADO"
          gh workflow run bateria.yml --repo "$GITHUB_REPOSITORY" --ref main
