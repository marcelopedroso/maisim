# Every PR: the quick test set (simu/validacao/ci.sh rapido) on the test instance — skipped when the PR only changes text
# (CHANGELOG, READMEs, LEIA, CONTRIBUTING). Green → Actions itself merges the PR into main (squash, branch deleted); the
# full suite runs once a day (full-suite.yml) — only for PRs by the repository owner,
# from a branch of this repository, not drafts and without the "do-not-merge" label (or the old "nao-juntar"); anyone else's PR waits for review.
# The merge only applies to the commit that was tested (--match-head-commit: a new commit in between is refused), and it
# also runs when a draft becomes ready (ready_for_review). Before merging, it waits for the Codex review to finish and
# refuses to merge with open conversations (.github/scripts/wait_for_codex.py). merge_group: also runs in GitHub's merge
# queue, if it is ever turned on. (A merge made with the Actions token does not trigger "push" in other workflows;
# workflow_dispatch does.)
# The main protection requires one approving review and nobody can approve their own PR: for the maintainer's PR, this
# verification is that review (Actions approves the tested commit right before merging it; the repository setting
# "Allow GitHub Actions to create and approve pull requests" is on for this). A collaborator's PR needs the maintainer's approval.
# Before the tests, a PR that changes the product has to add its line to CHANGELOG.md (the "changelog line?" step).
name: verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (quick)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: changelog line?
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # a PR that changes the product adds its line to CHANGELOG.md (CONTRIBUTING.md, item 5). Not asked of a PR that only
          # changes tests (simu/validacao/), CI (.github/), documentation (the .md files at the root, the LEIA.md files) or
          # VERSION alone (an -rc bump). Fails closed: if the file list cannot be read, the step fails
          arquivos=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[] | "\(.additions)\t\(.filename)"')
          [ -n "$arquivos" ] || { echo "could not read the PR's files"; exit 1; }
          produto=$(printf '%s\n' "$arquivos" | cut -f2- | grep -vE '^(VERSION|\.gitignore|[^/]*\.md|(.*/)?LEIA\.md|\.github/.*|\.githooks/.*|simu/validacao/.*)$' || true)
          if [ -z "$produto" ]; then echo "no product file in this PR: no changelog line asked"; exit 0; fi
          if printf '%s\n' "$arquivos" | awk -F'\t' '$2 == "CHANGELOG.md" && $1 > 0 { tem = 1 } END { exit !tem }'; then
            echo "CHANGELOG.md has lines added by this PR"; exit 0
          fi
          echo "::error title=No changelog line::This PR changes the product and adds nothing to CHANGELOG.md. Add one line under [Unreleased] (Added, Changed or Fixed) with this PR's number (#$PR): CONTRIBUTING.md, item 5."
          printf 'product files in this PR:\n%s\n' "$produto" | head -20
          exit 1
      - name: only text changed?
        id: texto
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # fails closed: if the file list cannot be read, the step fails (never "only text" by accident)
          arquivos=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename')
          [ -n "$arquivos" ] || { echo "could not read the PR's files"; exit 1; }
          outros=$(printf '%s\n' "$arquivos" | grep -vE '^(CHANGELOG\.md|README[^/]*\.md|CONTRIBUTING\.md|pacote/LEIA\.md)$' || true)
          if [ -z "$outros" ]; then echo "only text: no tests"; echo "so_texto=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.texto.outputs.so_texto != 'true'
      - uses: ./.github/actions/prepare
        if: steps.texto.outputs.so_texto != 'true'
      - name: run the tests
        if: steps.texto.outputs.so_texto != 'true'
        run: bash simu/validacao/ci.sh rapido
      - name: summary
        if: always()
        run: |
          { echo '```'; cat ~/.cache/maisim_teste/bateria/resumo.txt 2>/dev/null || echo "(no summary)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-verify
          path: |
            ~/.cache/maisim_teste/bateria/
            ~/.cache/maisim_teste/*.log
          retention-days: 14
          if-no-files-found: ignore

  merge:
    name: merge into main
    needs: tests
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == github.repository_owner
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
      && !contains(github.event.pull_request.labels.*.name, 'nao-juntar')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: wait for the Codex review and check conversations
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/wait_for_codex.py
      - name: approve the tested commit (main requires one approving review)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTED: ${{ github.event.pull_request.head.sha }}
        run: |
          # only the commit that was tested: one pushed in between is not approved (and the merge below refuses it too)
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$TESTED" \
            -f body="Verified by Actions: tests passed, the Codex review is done and no conversation is open." > /dev/null
      - name: squash into main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTED: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$TESTED"
          # issues the PR closes ("Closes #N"): GitHub does not close them when the merge is made with the Actions token
          # (only this repository's: "Fixes other/repo#N" must not close our #N)
          for n in $(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences \
                       -q '.closingIssuesReferences[] | select(.url | startswith("https://github.com/" + env.GITHUB_REPOSITORY + "/issues/")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closed by #$PR (merged by verify)." || true
          done
          # a new version (VERSION changed): the full suite now — tag, Release and packages (a merge made with the Actions
          # token does not trigger full-suite.yml's push)
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path' | grep -qx VERSION; then
            gh workflow run full-suite.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
