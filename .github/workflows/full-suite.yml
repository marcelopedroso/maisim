# Once a day (and on demand, e.g. before a version): the full test suite (simu/validacao/ci.sh completo — UI, API, offline and the live scope
# on the isolated instance). Green → a comment on every PR merged since the last green run ("full suite passed"), and,
# if VERSION changed, the vX.Y.Z tag and a Release with notes (a -rc version: pre-release), then packages.yml builds the
# AppImage and the Windows installer and attaches them. Red → an issue.
# Runs at 04:00 (Brasília) only if main changed since the last green run, when VERSION changes on main (a new version:
# tag, Release and packages right away), or by hand (Actions → full suite → Run workflow). Not after every merge: with
# ~30 PRs a day that spent the month's Actions minutes in one day (24/10/2026); verify.yml already tests each PR.
name: full suite

on:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: full-suite-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    name: anything new on main?
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow full-suite.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$prev" = "$GITHUB_SHA" ]; then
            echo "main has not changed since the last green full suite: nothing to do"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  suite:
    name: full test suite
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: run the tests
        run: bash simu/validacao/ci.sh completo
      - name: summary
        if: always()
        run: |
          { echo '```'; cat ~/.cache/maisim_teste/bateria/resumo.txt 2>/dev/null || echo "(no summary)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-full-suite
          path: |
            ~/.cache/maisim_teste/bateria/
            ~/.cache/maisim_teste/*.log
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: release (tag and notes)
    needs: suite
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tag and Release, if VERSION changed (a -rc version is a pre-release); then build the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d ' \n' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$v" > /dev/null; then echo "$v already exists: nothing to do"; exit 0; fi
          pre=""; case "$v" in *-*) pre="--prerelease";; esac
          gh release create "$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MaiSim $v" --generate-notes $pre
          gh workflow run pacotes.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$v"   # the AppImage and the installer

  covered:
    name: tell the PRs it covered
    needs: suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: comment on each PR merged since the last green full suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the previous green run (this one is still in progress, so it is not listed); a run cancelled by a newer merge
          # never gets here, and the next green one covers its PRs too
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow full-suite.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then faixa="$prev..$GITHUB_SHA"; else faixa="-1 $GITHUB_SHA"; fi
          prs=$(git log --format=%s $faixa | grep -o '(#[0-9]\+)$' | tr -d '(#)' | sort -un)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $prs; do
            gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body "✅ **Full suite passed** on main at ${GITHUB_SHA::7}, which includes this PR: $run" || true
          done
          echo "covered: ${prs:-none}"

  report:
    name: report failure
    needs: suite
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open an issue with the run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Full suite failed on main (${GITHUB_SHA::7})" \
            --body "The full test suite failed after the merge of ${GITHUB_SHA::7}. Summary and logs (with the UI test screenshots): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
