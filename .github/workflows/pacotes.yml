# The "just use it" packages for a version (pacote/LEIA.md): the Linux AppImage (x86_64 and ARM/aarch64, the ARM one also
# as a folder .tar.gz for places without FUSE, like Termux's proot), the Windows installer and the Android app (the APK,
# pacote/android/apk, signed with the official key from the secrets), built from the version's tag,
# smoke-tested (pacote/linux/fumaca.sh: start, run the buck, a Figures PDF, stop) and attached to its GitHub Release with
# their .sha256 files. "test only" builds and smoke-tests the dispatched branch and attaches nothing. Started by full-suite.yml right after it
# creates the Release (a Release made with the Actions token does not trigger other workflows; workflow_dispatch does),
# or by hand: Actions → packages → Run workflow, with the tag (e.g. v0.3.0-rc1).
name: packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the version tag to package (e.g. v0.3.0-rc1)"
        required: true
      test_only:
        description: "test only: build and smoke-test the dispatched branch, attach nothing (the tag is ignored)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: AppImage and Windows installer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}   # only through the environment, never pasted into a script (whoever dispatches chooses it)
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"   # sem cache: maven — o pom.xml do Gecko só existe depois do gecko/construir.sh (fora do git)
      - name: tools
        run: |
          # (o que o AppRun confere no sistema: a tela virtual e as bibliotecas de janela do Java)
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip xvfb libxtst6 libxrender1 libxi6 libxext6 fontconfig fonts-dejavu-core > /dev/null
          python3 -m pip install --quiet pillow
      - name: Linux AppImage
        run: bash pacote/linux/monta.sh
      - name: smoke test (the AppImage's MaiSim runs the buck and makes a PDF)
        run: bash pacote/linux/fumaca.sh
      - name: Windows installer
        run: bash pacote/windows/monta.sh
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # também com nome fixo (sem a versão): o link .../releases/latest/download/MaiSim-Setup.exe nunca muda (README, site)
          cd pacote/dist
          cp MaiSim-Setup-*.exe MaiSim-Setup.exe && sha256sum MaiSim-Setup.exe > MaiSim-Setup.exe.sha256
          cp MaiSim-*-x86_64.AppImage MaiSim-x86_64.AppImage && sha256sum MaiSim-x86_64.AppImage > MaiSim-x86_64.AppImage.sha256
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  arm:
    name: ARM (aarch64) AppImage and folder
    runs-on: ubuntu-24.04-arm   # free for public repositories; builds natively (the portable Python installs NumPy/matplotlib here)
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxtst6 libxrender1 libxi6 libxext6 fontconfig fonts-dejavu-core > /dev/null
          command -v mvn > /dev/null || sudo apt-get install -y -qq maven > /dev/null
      - name: ARM AppImage and folder
        run: bash pacote/linux/monta.sh
      - name: smoke test on ARM (the AppImage's MaiSim runs the buck and makes a PDF)
        run: bash pacote/linux/fumaca.sh
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # também com nome fixo (sem a versão), como o x86_64: os links .../releases/latest/download/... nunca mudam
          cd pacote/dist
          cp MaiSim-*-aarch64.AppImage MaiSim-aarch64.AppImage && sha256sum MaiSim-aarch64.AppImage > MaiSim-aarch64.AppImage.sha256
          cp MaiSim-*-aarch64.tar.gz MaiSim-aarch64.tar.gz && sha256sum MaiSim-aarch64.tar.gz > MaiSim-aarch64.tar.gz.sha256
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android app (the APK)
    runs-on: ubuntu-24.04   # has the Android SDK; the app is Kotlin + Gradle, arm64 only (no NDK: the proot comes prebuilt)
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: proot (prebuilt, checked by SHA-256)
        run: bash pacote/android/apk/proot.sh
      - name: APK (signed with the official key, checked against the registered fingerprint)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_NOME: ${{ secrets.ANDROID_CHAVE_NOME }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          cd pacote/android/apk
          # a chave só existe neste passo (fora do repositório; apagada no fim, mesmo se falhar)
          trap 'rm -f "$RUNNER_TEMP/maisim.keystore"' EXIT
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maisim.keystore"
            export MAISIM_KEYSTORE="$RUNNER_TEMP/maisim.keystore" MAISIM_KEYSTORE_SENHA="$ANDROID_KEYSTORE_SENHA" \
                   MAISIM_CHAVE_NOME="$ANDROID_CHAVE_NOME" MAISIM_CHAVE_SENHA="$ANDROID_CHAVE_SENHA"
          elif [ "${{ inputs.test_only }}" != "true" ]; then
            echo "no signing key (secrets): a release APK must be signed with the official key"; exit 1
          fi
          ./gradlew assembleRelease --no-daemon -q
          V=$(cat ../../../VERSION); mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/MaiSim-Android-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IMP=$("$BT/apksigner" verify --print-certs "../../dist/MaiSim-Android-$V.apk" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr a-f A-F | sed 's/../&:/g; s/:$//')
          echo "certificate SHA-256: $IMP"
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ "$IMP" != "$(cat chave.sha256)" ]; then
            echo "the APK is not signed with the registered key (chave.sha256)"; exit 1
          fi
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # também com nome fixo (sem a versão): o link .../releases/latest/download/MaiSim-Android.apk nunca muda (site)
          cd pacote/dist
          cp MaiSim-Android-*.apk MaiSim-Android.apk
          for f in MaiSim-Android-*.apk MaiSim-Android.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
