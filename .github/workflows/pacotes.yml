# The "just use it" packages for a version (pacote/LEIA.md): the Linux AppImage (x86_64 and ARM/aarch64, the ARM one also
# as a folder .tar.gz for places without FUSE, like Termux's proot), the Windows installer and the Android app (the APK,
# pacote/android/apk, signed with the official key from the secrets), built from the version's tag,
# smoke-tested (pacote/linux/fumaca.sh: start, run the buck, a Figures PDF, stop) and attached to its GitHub Release with
# their .sha256 files. "test only" builds and smoke-tests the dispatched branch and attaches nothing. Started by full-suite.yml right after it
# creates the Release (a Release made with the Actions token does not trigger other workflows; workflow_dispatch does),
# or by hand: Actions → packages → Run workflow, with the tag (e.g. v0.3.0-rc1).
# The Windows installer is built on Linux; the "windows" job then installs it silently on a real Windows and runs the same
# smoke test there (pacote/windows/fumaca.py). The Release is a draft (full-suite.yml creates it so): the "publish" job
# makes it public only when every job here passed. If one fails, the Release stays a draft (nobody sees it, the update
# check included) and the Windows job opens an issue.
name: packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the version tag to package (e.g. v0.3.0-rc1)"
        required: true
      test_only:
        description: "test only: build and smoke-test the dispatched branch, attach nothing (the tag is ignored)"
        type: boolean
        default: false

permissions:
  contents: read   # read-only by default; each job that writes asks for it

jobs:
  build:
    name: AppImage and Windows installer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write       # attach to the Release
      id-token: write       # the provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}   # only through the environment, never pasted into a script (whoever dispatches chooses it)
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "11"   # sem cache: maven — o pom.xml do Gecko só existe depois do gecko/construir.sh (fora do git)
      - name: tools
        run: |
          # (o que o AppRun confere no sistema: a tela virtual e as bibliotecas de janela do Java)
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip xvfb libxtst6 libxrender1 libxi6 libxext6 fontconfig fonts-dejavu-core > /dev/null
          python3 -m pip install --quiet --require-hashes -r .github/ci/requirements.txt   # o Pillow com os hashes
      - name: Linux AppImage
        run: bash pacote/linux/monta.sh
      - name: smoke test (the AppImage's MaiSim runs the buck and makes a PDF)
        run: bash pacote/linux/fumaca.sh
      - name: Windows installer
        run: bash pacote/windows/monta.sh
      - name: hand the installer to the Windows job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: pacote/dist/MaiSim-Setup-*.exe
          retention-days: 1
          if-no-files-found: error
      - name: provenance attestation (signed by GitHub; proves this file was built here, from this commit)
        id: atestado   # também no test_only: confere o passo antes de uma versão (o atestado diz o commit da branch)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            pacote/dist/MaiSim-Setup-*.exe
            pacote/dist/MaiSim-*-x86_64.AppImage
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATESTADO: ${{ steps.atestado.outputs.bundle-path }}   # (pelo ambiente, nunca colado no script)
        run: |
          # a assinatura (sigstore) do atestado de procedência ao lado dos pacotes: quem baixa confere com o cosign ou o gh
          cp "$ATESTADO" "pacote/dist/MaiSim-${TAG#v}-x86_64-windows.sigstore.json"
          python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["dsseEnvelope"], separators=(",", ":")))' "$ATESTADO" \
            > "pacote/dist/MaiSim-${TAG#v}-x86_64-windows.intoto.jsonl"   # a procedência (o envelope in-toto do atestado), no formato que o Scorecard procura
          # também com nome fixo (sem a versão): o link .../releases/latest/download/MaiSim-Setup.exe nunca muda (README, site)
          cd pacote/dist
          cp MaiSim-Setup-*.exe MaiSim-Setup.exe && sha256sum MaiSim-Setup.exe > MaiSim-Setup.exe.sha256
          cp MaiSim-*-x86_64.AppImage MaiSim-x86_64.AppImage && sha256sum MaiSim-x86_64.AppImage > MaiSim-x86_64.AppImage.sha256
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows installer on a real Windows (smoke test)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ inputs.tag }}   # only through the environment, as in the other jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: instalador
      - name: browser for the screen walk (Playwright's Chromium; the same version the test suite uses)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ns-test" && cp .github/ci/node/package.json .github/ci/node/package-lock.json "$RUNNER_TEMP/ns-test/"
          cd "$RUNNER_TEMP/ns-test" && npm ci --no-audit --no-fund > /dev/null   # as versões e os hashes do package-lock.json
          npx playwright install chromium > /dev/null
          echo "NODE_PATH=$(cygpath -w "$RUNNER_TEMP/ns-test/node_modules")" >> "$GITHUB_ENV"
      - name: smoke test (installs silently; the installed MaiSim runs the buck, makes a PDF, runs the C control and every example, walks the screens in a browser and stops)
        env:
          MAISIM_FUMACA_TELAS: "1"
        run: python pacote/windows/fumaca.py instalador
      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-logs
          path: fumaca-logs/
          retention-days: 14
          if-no-files-found: ignore
      - name: open an issue with the run link
        if: ${{ failure() && !inputs.test_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Windows smoke test failed for $TAG" \
            --body "The smoke test of the Windows installer of $TAG failed on Windows (install, start, the buck, a PDF, the C control, stop), so the Release was left as a draft: not published. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  windows-suite:
    name: the whole test suite on a real Windows, on the installed MaiSim (measuring; does not block the Release yet)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 180
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_only && github.ref || inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: instalador
      - name: install MaiSim silently (as a user would) and put the tests next to it
        shell: pwsh
        run: |
          $exe = Get-ChildItem instalador\MaiSim-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=en'
          $prog = Join-Path $env:LOCALAPPDATA 'Programs\MaiSim'
          if (-not (Test-Path "$prog\python\python.exe")) { throw "MaiSim did not install in $prog" }
          Copy-Item -Recurse -Force simu\validacao "$prog\maisim\simu\validacao"   # the package leaves the tests out
          "PROG=$prog" >> $env:GITHUB_ENV
          "BATERIA=$HOME\.cache\maisim_teste\bateria" >> $env:GITHUB_ENV
          "TESTE=$HOME\.cache\maisim_teste" >> $env:GITHUB_ENV
      - name: browser for the screen tests (Playwright's Chromium; the same version the suite uses)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ns-test" && cp .github/ci/node/package.json .github/ci/node/package-lock.json "$RUNNER_TEMP/ns-test/"
          cd "$RUNNER_TEMP/ns-test" && npm ci --no-audit --no-fund > /dev/null   # as versões e os hashes do package-lock.json
          npx playwright install chromium > /dev/null
          echo "NODE_PATH=$(cygpath -w "$RUNNER_TEMP/ns-test/node_modules")" >> "$GITHUB_ENV"
      - name: the whole suite (the test instance of the installed MaiSim, with its Python, Java and TinyCC)
        shell: pwsh
        env:
          CI: "true"
        run: |
          & "$env:PROG\python\python.exe" -X utf8 "$env:PROG\maisim\simu\validacao\ci.py" completo --sobe --maisim "$env:PROG\maisim"
      - name: keep the summary and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-suite-logs
          path: |
            ${{ env.BATERIA }}
            ${{ env.TESTE }}/*.log
          retention-days: 14
          if-no-files-found: ignore

  arm:
    name: ARM (aarch64) AppImage and folder
    runs-on: ubuntu-24.04-arm   # free for public repositories; builds natively (the portable Python installs NumPy/matplotlib here)
    timeout-minutes: 60
    permissions:
      contents: write       # attach to the Release
      id-token: write       # the provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "11"
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxtst6 libxrender1 libxi6 libxext6 fontconfig fonts-dejavu-core > /dev/null
          command -v mvn > /dev/null || sudo apt-get install -y -qq maven > /dev/null
      - name: ARM AppImage and folder
        run: bash pacote/linux/monta.sh
      - name: smoke test on ARM (the AppImage's MaiSim runs the buck and makes a PDF)
        run: bash pacote/linux/fumaca.sh
      - name: provenance attestation (signed by GitHub; proves this file was built here, from this commit)
        id: atestado   # também no test_only: confere o passo antes de uma versão (o atestado diz o commit da branch)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            pacote/dist/MaiSim-*-aarch64.AppImage
            pacote/dist/MaiSim-*-aarch64.tar.gz
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATESTADO: ${{ steps.atestado.outputs.bundle-path }}   # (pelo ambiente, nunca colado no script)
        run: |
          # a assinatura (sigstore) do atestado de procedência ao lado dos pacotes: quem baixa confere com o cosign ou o gh
          cp "$ATESTADO" "pacote/dist/MaiSim-${TAG#v}-aarch64.sigstore.json"
          python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["dsseEnvelope"], separators=(",", ":")))' "$ATESTADO" \
            > "pacote/dist/MaiSim-${TAG#v}-aarch64.intoto.jsonl"   # a procedência (o envelope in-toto do atestado), no formato que o Scorecard procura
          # também com nome fixo (sem a versão), como o x86_64: os links .../releases/latest/download/... nunca mudam
          cd pacote/dist
          cp MaiSim-*-aarch64.AppImage MaiSim-aarch64.AppImage && sha256sum MaiSim-aarch64.AppImage > MaiSim-aarch64.AppImage.sha256
          cp MaiSim-*-aarch64.tar.gz MaiSim-aarch64.tar.gz && sha256sum MaiSim-aarch64.tar.gz > MaiSim-aarch64.tar.gz.sha256
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android app (the APK)
    runs-on: ubuntu-24.04   # has the Android SDK; the app is Kotlin + Gradle, arm64 only (no NDK: the proot comes prebuilt)
    timeout-minutes: 30
    permissions:
      contents: write       # attach to the Release
      id-token: write       # the provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: check the tag
        if: ${{ !inputs.test_only }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_only && github.ref || env.TAG }}
      - name: the Gradle wrapper in the repository is the official one (its checksum against gradle.org)
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: proot (prebuilt, checked by SHA-256)
        run: bash pacote/android/apk/proot.sh
      - name: APK (signed with the official key, checked against the registered fingerprint)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_NOME: ${{ secrets.ANDROID_CHAVE_NOME }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          cd pacote/android/apk
          # a chave só existe neste passo (fora do repositório; apagada no fim, mesmo se falhar)
          trap 'rm -f "$RUNNER_TEMP/maisim.keystore"' EXIT
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maisim.keystore"
            export MAISIM_KEYSTORE="$RUNNER_TEMP/maisim.keystore" MAISIM_KEYSTORE_SENHA="$ANDROID_KEYSTORE_SENHA" \
                   MAISIM_CHAVE_NOME="$ANDROID_CHAVE_NOME" MAISIM_CHAVE_SENHA="$ANDROID_CHAVE_SENHA"
          elif [ "${{ inputs.test_only }}" != "true" ]; then
            echo "no signing key (secrets): a release APK must be signed with the official key"; exit 1
          fi
          ./gradlew lintRelease assembleRelease --no-daemon -q   # (o lint barra API que não existe no Android 10, a versão mínima)
          V=$(cat ../../../VERSION); mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/MaiSim-Android-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IMP=$("$BT/apksigner" verify --print-certs "../../dist/MaiSim-Android-$V.apk" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr a-f A-F | sed 's/../&:/g; s/:$//')
          echo "certificate SHA-256: $IMP"
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ "$IMP" != "$(cat chave.sha256)" ]; then
            echo "the APK is not signed with the registered key (chave.sha256)"; exit 1
          fi
      - name: provenance attestation (signed by GitHub; proves this file was built here, from this commit)
        id: atestado   # também no test_only: confere o passo antes de uma versão (o atestado diz o commit da branch)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            pacote/dist/MaiSim-Android-*.apk
      - name: attach to the Release
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATESTADO: ${{ steps.atestado.outputs.bundle-path }}   # (pelo ambiente, nunca colado no script)
        run: |
          # a assinatura (sigstore) do atestado de procedência ao lado dos pacotes: quem baixa confere com o cosign ou o gh
          cp "$ATESTADO" "pacote/dist/MaiSim-${TAG#v}-android.sigstore.json"
          python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["dsseEnvelope"], separators=(",", ":")))' "$ATESTADO" \
            > "pacote/dist/MaiSim-${TAG#v}-android.intoto.jsonl"   # a procedência (o envelope in-toto do atestado), no formato que o Scorecard procura
          # também com nome fixo (sem a versão): o link .../releases/latest/download/MaiSim-Android.apk nunca muda (site)
          cd pacote/dist
          cp MaiSim-Android-*.apk MaiSim-Android.apk
          for f in MaiSim-Android-*.apk MaiSim-Android.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: publish the Release (every package passed its smoke test)
    needs: [build, windows, arm, android]
    if: ${{ !inputs.test_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # make the draft Release public
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - name: publish (a draft until here; a Release that is already public stays as it is)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
