name: prepare the MaiSim test instance
description: >-
  Java 11, Node 22, system packages, GeckoCIRCUITS (upstream at a pinned commit + the patch, cached), the web page
  (Vite), Playwright and Claude Code (no login: the tests' fake claude only passes it the login and state), and the
  test instance up (simu/validacao/sobe_teste.sh, profile config/teste.env).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "11"
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: system packages (virtual display, xwininfo, XTest, numpy)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb x11-utils libxtst6 python3-numpy > /dev/null
    - name: matplotlib (the Figures module; pinned like the packages, with its own STIX fonts)
      shell: bash
      run: python3 -m pip install --quiet --user --break-system-packages "matplotlib==3.10.8"
    - name: cache the built GeckoCIRCUITS
      uses: actions/cache@v6
      with:
        path: |
          gecko/build/gecko-lote.jar
          gecko/build/.patches
        key: gecko-${{ hashFiles('gecko/construir.sh', 'gecko/patches/**') }}
    - name: cache Maven
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: m2-${{ hashFiles('gecko/construir.sh', 'gecko/patches/**') }}
        restore-keys: m2-
    - name: build GeckoCIRCUITS (upstream at a pinned commit + the batch read patch)
      shell: bash
      run: bash gecko/construir.sh
    - name: web page (Vite)
      shell: bash
      run: npm ci --prefix app --no-audit --no-fund
    - name: Monaco offline (simu/vendor.sh, pinned + SHA-256)
      shell: bash
      run: bash simu/vendor.sh
    - name: Playwright (Chromium) and Claude Code
      shell: bash
      run: |
        mkdir -p ~/ns-test && cd ~/ns-test
        npm init -y > /dev/null
        npm install --no-audit --no-fund playwright@1.62.0 > /dev/null
        npx playwright install --with-deps chromium > /dev/null
        curl -fsSL https://claude.ai/install.sh | bash > /dev/null
        ~/.local/bin/claude --version
    - name: start the test instance
      shell: bash
      run: bash simu/validacao/sobe_teste.sh
