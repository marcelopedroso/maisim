name: prepare the MaiSim test instance
description: >-
  Java 11, Node 22, system packages, GeckoCIRCUITS (upstream at a pinned commit + the patch, cached), the web page
  (Vite), Playwright and Claude Code (no login: the tests' fake claude only passes it the login and state), and the
  test instance up (simu/validacao/sobe_teste.sh, profile config/teste.env).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "11"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: system packages (virtual display, xwininfo, XTest, numpy)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb x11-utils libxtst6 python3-numpy > /dev/null
    - name: matplotlib (the Figures module; pinned like the packages, with its own STIX fonts)
      shell: bash
      # (o numpy das releases junto: o do apt é antigo para o matplotlib 3.10; o --break-system-packages só onde o pip o pede)
      run: |
        python3 -m pip install --quiet --user "numpy==2.2.6" "matplotlib==3.10.8" 2>/dev/null \
          || python3 -m pip install --quiet --user --break-system-packages "numpy==2.2.6" "matplotlib==3.10.8"
    - name: cache the built GeckoCIRCUITS
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          gecko/build/gecko-lote.jar
          gecko/build/.patches
        key: gecko-${{ hashFiles('gecko/construir.sh', 'gecko/patches/**') }}
    - name: cache Maven
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: m2-${{ hashFiles('gecko/construir.sh', 'gecko/patches/**') }}
        restore-keys: m2-
    - name: build GeckoCIRCUITS (upstream at a pinned commit + the batch read patch)
      shell: bash
      run: bash gecko/construir.sh
    - name: web page (Vite)
      shell: bash
      run: npm ci --prefix app --no-audit --no-fund
    - name: TinyCC (pacote/tcc.sh, the packages' embedded C compiler, for simu/validacao/tcc_offline.py)
      shell: bash
      run: bash pacote/tcc.sh pacote/.build/tcc
    - name: Monaco offline (simu/vendor.sh, pinned + SHA-256)
      shell: bash
      run: bash simu/vendor.sh
    - name: Playwright (Chromium) and Claude Code
      shell: bash
      run: |
        mkdir -p ~/ns-test && cp .github/ci/node/package.json .github/ci/node/package-lock.json ~/ns-test/
        cd ~/ns-test && npm ci --no-audit --no-fund > /dev/null   # as versões e os hashes do package-lock.json
        npx playwright install --with-deps chromium > /dev/null
        curl -fsSL https://claude.ai/install.sh | bash > /dev/null
        ~/.local/bin/claude --version
    - name: start the test instance
      shell: bash
      run: bash simu/validacao/sobe_teste.sh
