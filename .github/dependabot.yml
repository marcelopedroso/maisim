# Dependabot (free for public repositories): weekly PRs that update the versions of the GitHub Actions used by the
# workflows (and by the composite action in .github/actions/prepare) and the page's dev dependency (Vite). The security
# alerts and fixes for vulnerable dependencies are on in the repository settings. Dependabot PRs go through verify like
# any other, and are not merged automatically (the merge job only merges the owner's PRs).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/prepare"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # the provenance action stays on v2: v4 failed 2 of 6 attestations on 22/11/2026 ("error fetching tlog entry - (404)"
      # from the Sigstore transparency log; it passed on a rerun), and a failed attestation leaves a Release unpublished.
      # Remove this once v4 has been tried again in a "test only" packages run without failures.
      - dependency-name: "actions/attest-build-provenance"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "Page"
  - package-ecosystem: docker                  # the ClusterFuzzLite base image (pinned by digest)
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
